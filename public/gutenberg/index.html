<!doctype html>
<html lang="en" data-base-path="/gutenberg">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Rare Word Explorer | Nic Murray</title>
    <meta
      name="description"
      content="Upload text and surface rare words using a local Gutenberg frequency list."
    />
    <meta property="og:title" content="Rare Word Explorer" />
    <meta
      property="og:description"
      content="Upload text and surface rare words using a local Gutenberg frequency list."
    />
    <meta property="og:type" content="website" />
    <meta name="theme-color" content="#f4f6f3" />
    <link rel="stylesheet" href="./styles.css" />
    <script type="module" src="./app.js"></script>
  </head>
  <body>
    <div class="shell">
      <header class="topbar">
        <a class="wordmark" href="https://njmurray.com/" aria-label="njmurray homepage">
          <span class="mark" aria-hidden="true">N</span>
          <span>njmurray</span>
        </a>
        <nav aria-label="Primary navigation">
          <a href="https://njmurray.com/books/">Books</a>
          <a href="https://njmurray.com/playlist/">Playlist Finder</a>
          <a href="https://njmurray.com/gutenberg" aria-current="page">Rare Words</a>
          <a href="https://github.com/NicJMurray" rel="noopener" target="_blank">GitHub</a>
        </nav>
      </header>

      <main>
        <section class="app-head" aria-labelledby="app-title">
          <div>
            <p class="eyebrow">Gutenberg</p>
            <h1 id="app-title">Rare Word Explorer</h1>
          </div>
          <div class="load-state" aria-live="polite">
            <span id="frequencyStatus">Loading frequency list</span>
            <span class="load-track" aria-hidden="true"><span id="loadBar"></span></span>
          </div>
        </section>

        <section class="workspace" aria-label="Rare word analysis">
          <form class="controls" id="settingsForm">
            <label class="upload-target" id="dropTarget" for="fileInput">
              <span class="upload-icon" aria-hidden="true">
                <svg viewBox="0 0 24 24" fill="none">
                  <path d="M12 16V4m0 0 5 5m-5-5L7 9" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" />
                  <path d="M5 16v3h14v-3" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" />
                </svg>
              </span>
              <span>
                <strong id="fileName">Choose a text file</strong>
                <small id="fileMeta">Plain text</small>
              </span>
            </label>
            <input id="fileInput" name="file" type="file" accept=".txt,text/plain" />

            <div class="field">
              <label for="topN">Rare words</label>
              <div class="range-row">
                <input id="topN" name="topN" type="range" min="10" max="2000" value="100" step="10" />
                <output id="topNValue" for="topN">100</output>
              </div>
            </div>

            <div class="switches" aria-label="Display options">
              <label class="switch">
                <input id="showCounts" type="checkbox" checked />
                <span>Counts</span>
              </label>
              <label class="switch">
                <input id="showContext" type="checkbox" checked />
                <span>Context</span>
              </label>
              <label class="switch">
                <input id="showUnmatched" type="checkbox" />
                <span>Unmatched</span>
              </label>
            </div>

            <div class="field">
              <label for="searchInput">Filter</label>
              <input id="searchInput" name="search" type="search" autocomplete="off" placeholder="Word" />
            </div>
          </form>

          <section class="results" aria-live="polite">
            <div class="stats" aria-label="Analysis summary">
              <div>
                <span>Total Words</span>
                <strong id="totalWords">0</strong>
              </div>
              <div>
                <span>Unique Words</span>
                <strong id="uniqueWords">0</strong>
              </div>
              <div>
                <span>Matched</span>
                <strong id="matchedWords">0</strong>
              </div>
              <div>
                <span>Missing</span>
                <strong id="missingWords">0</strong>
              </div>
            </div>

            <div class="table-toolbar">
              <div>
                <h2 id="resultTitle">Selected Words</h2>
                <p id="resultMeta">No file selected</p>
              </div>
              <div class="actions">
                <button id="downloadRare" type="button" disabled>
                  <svg viewBox="0 0 24 24" fill="none" aria-hidden="true">
                    <path d="M12 4v10m0 0 4-4m-4 4-4-4" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" />
                    <path d="M5 20h14" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" />
                  </svg>
                  Rare CSV
                </button>
                <button id="downloadMissing" type="button" disabled>
                  <svg viewBox="0 0 24 24" fill="none" aria-hidden="true">
                    <path d="M12 4v10m0 0 4-4m-4 4-4-4" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" />
                    <path d="M5 20h14" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" />
                  </svg>
                  Missing TXT
                </button>
              </div>
            </div>

            <div class="empty-state" id="emptyState">No file selected.</div>
            <div class="table-wrap" id="tableWrap" hidden>
              <table>
                <thead id="resultHead"></thead>
                <tbody id="resultBody"></tbody>
              </table>
            </div>

            <details class="missing-panel" id="missingPanel" hidden>
              <summary>
                <span>Unmatched Words</span>
                <span id="missingMeta">0</span>
              </summary>
              <div class="table-wrap table-wrap--compact">
                <table>
                  <thead id="missingHead"></thead>
                  <tbody id="missingBody"></tbody>
                </table>
              </div>
            </details>
          </section>
        </section>
      </main>

      <footer>
        <a href="https://njmurray.com/">&copy; <span id="year"></span> Nic Murray</a>
      </footer>
    </div>
  </body>
</html>
